version: '3.9'

services:
  web:
    build:
      context: .
      args:
        DB_HOST: host.docker.internal
        DB_PORT: 3306
        DB_NAME: planner
        DB_USER: planner
        DB_PASS: planner
    ports:
      - "13000:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_NAME=planner
      - DB_USER=planner
      - DB_PASS=planner
      # Shared with planner-data's REVALIDATE_SECRET; change this default
      # in the actual production deployment.
      - REVALIDATE_SECRET=changeme
    extra_hosts:
      - "host.docker.internal:host-gateway"
